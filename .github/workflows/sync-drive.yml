name: Sync Repository to Google Drive

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Authenticate and Sync to Google Drive
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          cat << 'EOF' > sync.py
          import os
          import json
          from google.oauth2.service_account import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          creds_json = json.loads(os.environ['GCP_SA_KEY'])
          folder_id = os.environ['GDRIVE_FOLDER_ID']
          
          scopes = ['https://www.googleapis.com/auth/drive']
          creds = Credentials.from_service_account_info(creds_json, scopes=scopes)
          service = build('drive', 'v3', credentials=creds)

          for root, dirs, files in os.walk('.'):
              if '.git' in root or 'sync.py' in files:
                  continue
              for file in files:
                  filepath = os.path.join(root, file)
                  file_metadata = {
                      'name': file,
                      'parents': [folder_id]
                  }
                  # Removido resumable=True para evitar validação de cota na conta de serviço
                  media = MediaFileUpload(filepath)
                  uploaded_file = service.files().create(
                      body=file_metadata,
                      media_body=media,
                      supportsAllDrives=True,
                      fields='id'
                  ).execute()
                  print(f'Sincronizado: {filepath}')
          EOF
          python sync.py
          
          # ... (código anterior igual)
