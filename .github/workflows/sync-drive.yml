name: Sync Repository to Google Drive

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Authenticate, Merge and Sync
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
        run: |
          cat << 'EOF' > sync.py
          import os
          import json
          from google.oauth2.service_account import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          creds_json = json.loads(os.environ['GCP_SA_KEY'])
          file_id = os.environ['GDRIVE_FILE_ID']
          
          scopes = ['https://www.googleapis.com/auth/drive']
          creds = Credentials.from_service_account_info(creds_json, scopes=scopes)
          service = build('drive', 'v3', credentials=creds)

          output_filename = 'conhecimento_gemini.txt'
          print("Compilando código fonte...")
          
          with open(output_filename, 'w', encoding='utf-8') as outfile:
              for root, dirs, files in os.walk('.'):
                  if '.git' in root or root.startswith('./.github'):
                      continue
                  for file in files:
                      if file in ['sync.py', output_filename]:
                          continue
                      filepath = os.path.join(root, file)
                      try:
                          with open(filepath, 'r', encoding='utf-8') as infile:
                              outfile.write(f"\n\n{'='*40}\n")
                              outfile.write(f"ARQUIVO: {filepath}\n")
                              outfile.write(f"{'='*40}\n\n")
                              outfile.write(infile.read())
                      except UnicodeDecodeError:
                          pass # Ignora arquivos que não são texto (imagens, etc)

          print("Enviando atualização para o Google Drive...")
          media = MediaFileUpload(output_filename, mimetype='text/plain')
          service.files().update(
              fileId=file_id,
              media_body=media
          ).execute()
          print("Sucesso! Cérebro do Gemini atualizado.")
          EOF
          python sync.py
          
