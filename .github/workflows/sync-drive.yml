name: Sync Repository to Google Drive

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydrive2

      - name: Authenticate and Sync to Google Drive
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          cat << 'EOF' > sync.py
          import os
          import json
          from pydrive2.auth import GoogleAuth
          from pydrive2.drive import GoogleDrive

          # Salva a chave temporariamente para a biblioteca autenticar
          key_data = json.loads(os.environ['GCP_SA_KEY'])
          with open('sa_key.json', 'w') as f:
              json.dump(key_data, f)

          folder_id = os.environ['GDRIVE_FOLDER_ID']

          settings = {
              "client_config_backend": "service",
              "service_config": {
                  "client_json_file_path": "sa_key.json",
              }
          }

          gauth = GoogleAuth(settings=settings)
          gauth.ServiceAuth()
          drive = GoogleDrive(gauth)

          print(f"Lendo diretório: {os.getcwd()}")

          for root, dirs, files in os.walk('.'):
              if '.git' in root or root.startswith('./.github'):
                  continue
              for file in files:
                  if file in ['sync.py', 'sa_key.json']:
                      continue
                  filepath = os.path.join(root, file)
                  
                  # Cria e envia o arquivo forçando o vínculo direto à pasta do destinatário
                  gfile = drive.CreateFile({
                      'title': file,
                      'parents': [{'id': folder_id}]
                  })
                  gfile.SetContentFile(filepath)
                  gfile.Upload(param={'supportsAllDrives': True})
                  print(f'Sincronizado: {filepath}')

          # Remove a chave temporária ao terminar
          if os.path.exists('sa_key.json'):
              os.remove('sa_key.json')
          EOF
          python sync.py
          
